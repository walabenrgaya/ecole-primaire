# Déploiement Render (option B) : « New > Blueprint » puis sélectionner ce dépôt.
# Render crée la base PostgreSQL, génère JWT_SECRET et fournit une URL HTTPS.
services:
  - type: web
    name: edupilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANNEE_SCOLAIRE
        value: 2026-2027
      - key: DATABASE_URL
        fromDatabase:
          name: edupilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false   # à renseigner : https://edupilot.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: edupilot-db
    databaseName: ecole
    plan: free
    region: frankfurt
