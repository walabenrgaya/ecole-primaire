# Reverse proxy Nginx (options C et D). Remplacez votre-domaine.tn par votre domaine.
# Après obtention du certificat (certbot), décommentez le bloc HTTPS.
server {
    listen 80;
    server_name votre-domaine.tn www.votre-domaine.tn localhost;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 12M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # return 301 https://$host$request_uri;   # à activer une fois HTTPS en place
}

