# =====================================================================
# DOCKER-COMPOSE POUR DÉPLOIEMENT VPS / PRODUCTION (Option D du CDC)
# Inclut l'Application, MongoDB et Nginx Reverse Proxy avec SSL
# =====================================================================

version: '3.8'

services:
  # Base de données MongoDB avec volume persistant
  mongodb:
    image: mongo:7.0
    container_name: ecole-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ecole
    volumes:
      - mongo-data:/data/db
    networks:
      - ecole-network

  # Application Web MERN unifiée (API Express + Frontend React)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecole-app
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/ecole
      JWT_SECRET: ${JWT_SECRET:-secret_production_key_a_changer}
      ANNEE_SCOLAIRE: ${ANNEE_SCOLAIRE:-2026-2027}
      FRAIS_SCOLARITE: ${FRAIS_SCOLARITE:-1200}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecole.tn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"École Primaire" <contact@ecole.tn>}
    volumes:
      - uploads-data:/app/server/uploads
    depends_on:
      - mongodb
    networks:
      - ecole-network

  # Reverse Proxy Nginx avec compression, sécurité et SSL
  nginx:
    image: nginx:alpine
    container_name: ecole-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - uploads-data:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - ecole-network

volumes:
  mongo-data:
    driver: local
  uploads-data:
    driver: local
  certbot-etc:
  certbot-var:

networks:
  ecole-network:
    driver: bridge
