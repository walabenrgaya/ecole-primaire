# =====================================================================
# Pile de production (serveur Linux) :
#   - app        : EduPilot (API + interface), port interne 5000
#   - db         : PostgreSQL 16 (bases « ecole » et « nextcloud »)
#   - nextcloud  : espace documentaire (dépôts d'élèves, reçus PDF archivés)
#   - caddy      : reverse proxy HTTPS automatique (Let's Encrypt)
# Installation guidée : scripts/installer-serveur.sh  (génère .env)
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecole
      POSTGRES_USER: ecole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD manquant dans .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecole -d ecole"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://ecole:${POSTGRES_PASSWORD}@db:5432/ecole
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ANNEE_SCOLAIRE: ${ANNEE_SCOLAIRE:-2026-2027}
      PUBLIC_URL: https://${APP_DOMAIN}
      # Stockage des fichiers dans Nextcloud (WebDAV, réseau Docker interne)
      NEXTCLOUD_URL: http://nextcloud
      NEXTCLOUD_PUBLIC_URL: https://${CLOUD_DOMAIN}
      NEXTCLOUD_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_DIR: EduPilot
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-EduPilot <no-reply@edupilot.tn>}
    volumes:
      - uploads:/app/server/uploads

  nextcloud:
    image: nextcloud:30-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD manquant dans .env}
      # « nextcloud » : nom utilisé par EduPilot sur le réseau interne
      NEXTCLOUD_TRUSTED_DOMAINS: ${CLOUD_DOMAIN} nextcloud
      OVERWRITEPROTOCOL: https
      TRUSTED_PROXIES: 172.16.0.0/12
      PHP_UPLOAD_LIMIT: 1G
    volumes:
      - nextcloud-data:/var/www/html

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app, nextcloud]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN manquant dans .env}
      CLOUD_DOMAIN: ${CLOUD_DOMAIN:?CLOUD_DOMAIN manquant dans .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pg-data:
  uploads:
  nextcloud-data:
  caddy-data:
  caddy-config:
