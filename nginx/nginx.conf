# =====================================================================
# CONFIGURATION REVERSE PROXY NGINX (Option C & Option D du CDC)
# =====================================================================

server {
    listen 80;
    server_name localhost ecole-aboukacem-chebbi.com www.ecole-aboukacem-chebbi.com;

    # Headers de sécurité conformes aux exigences RGPD et WCAG
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression gzip pour des temps de réponse < 2s
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Taille maximale des pièces jointes et devoirs
    client_max_body_size 25M;

    # Proxy vers l'application Node.js
    location / {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache statique pour les assets du client React
    location /assets/ {
        proxy_pass http://app:5000/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fichiers uploadés (devoirs, corrigés, photos)
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
