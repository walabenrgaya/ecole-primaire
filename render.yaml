# =====================================================================
# CONFIGURATION RENDER BLUEPRINT (Option B du CDC)
# =====================================================================

services:
  - type: web
    name: ecole-primaire-app
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ANNEE_SCOLAIRE
        value: 2026-2027
      - key: FRAIS_SCOLARITE
        value: 1200
      - key: DATABASE_URL
        fromDatabase:
          name: ecole-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: ecole-postgres
    databaseName: ecole
    user: ecole_user
    plan: free
    region: frankfurt
