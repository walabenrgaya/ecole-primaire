# =====================================================================
# Déploiement VPS (option D) : PostgreSQL + application + Nginx
#   1. cp .env.example .env  puis renseigner JWT_SECRET, POSTGRES_PASSWORD
#   2. docker compose up -d --build
# La base est initialisée automatiquement (schéma + données de démo) au
# premier démarrage. HTTPS : voir docs/GUIDE_DEPLOIEMENT.md (certbot).
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecole
      POSTGRES_USER: ecole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecole -d ecole"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://ecole:${POSTGRES_PASSWORD}@db:5432/ecole
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env}
      ANNEE_SCOLAIRE: ${ANNEE_SCOLAIRE:-2026-2027}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-EduPilot <no-reply@edupilot.tn>}
    volumes:
      - uploads:/app/server/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  pg-data:
  uploads:
